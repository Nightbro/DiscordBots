# Echo Bot — Srpski banner / help sadržaj
# Odvojeno od locales/sr.yaml (kratke UI poruke) radi lakšeg pronalaženja.
# {prefix} → prefiks komande, {bot} → ime bota, {page}/{total} → paginacija.

help:
  prev: "◀ Prethodno"
  next: "Sledeće ▶"
  footer: "{bot} • Strana {page}/{total}"

  overview:
    title: "{bot} Pomoć"
    body: |
      Koristi `{prefix}help <sekcija>` ili dugmad ispod za pregled.

      `music` — kontrole reprodukcije
      `library` — pesme otpremljene na ovaj server
      `queue` — red i plejliste
      `intros` — lični zvuci pri ulasku
      `soundboard` — tabla sa zvukovima
      `tts` — tekst u govor
      `settings` — podešavanja servera *(admini)*

      `{prefix}version` — verzija bota · `{prefix}listen` — glasovno slušanje *(nije implementirano)*

      Većina komandi radi i kao slash komande — ukucaj `/` za pregled.
      `{prefix}save`, `{prefix}library`, `{prefix}devlog` i `{prefix}version` rade samo sa prefiksom.

  music:
    title: "🎵 Muzika — Reprodukcija"
    body: |
      `{prefix}play <url|pretraga|ime|#N>` (`{prefix}p`) — dodaj pesmu u red
      (ime koje odgovara otpremljenoj pesmi pušta nju — vidi `library`)
      `{prefix}skip` (`{prefix}s`) — preskoči trenutnu pesmu
      `{prefix}pause` — pauziraj reprodukciju
      `{prefix}replay` (`{prefix}rp`) — pusti trenutnu pesmu od početka
      `{prefix}resume` — nastavi reprodukciju
      `{prefix}stop` — zaustavi i obriši red
      `{prefix}nowplaying` (`{prefix}np`) — prikaži trenutnu pesmu
      `{prefix}join` — pridruži se glasovnom kanalu
      `{prefix}leave` (`{prefix}dc`) — napusti glasovni kanal

  queue:
    title: "📋 Muzika — Red i Plejliste"
    body: |
      `{prefix}queue [strana]` (`{prefix}q`) — prikaži red
      `{prefix}clear` — obriši red (zadržava trenutnu pesmu)
      `{prefix}remove <#>` (`{prefix}rm`) — ukloni pesmu po poziciji
      `{prefix}shuffle` — pomešaj red

      `{prefix}playlist save <ime>` — sačuvaj red kao plejlistu
      `{prefix}playlist load <ime>` — učitaj plejlistu
      `{prefix}playlist list` — lista sačuvanih plejlisti
      `{prefix}playlist delete <ime>` — obriši plejlistu
      `{prefix}playlist show <ime>` — prikaži sadržaj plejliste

  library:
    title: "💾 Biblioteka — otpremljene pesme"
    body: |
      `{prefix}save <ime>` — sačuvaj priloženi audio fajl u biblioteku servera
      (radi i kada odgovoriš na poruku koja sadrži fajl)
      `{prefix}library` — pregledaj: numerisana lista, meni za puštanje, strane
      `{prefix}library <ime|#N>` (ili `{prefix}lib play <ime|#N>`) — pusti otpremljenu pesmu
      `{prefix}lib remove <ime|#N>` — ukloni pesmu
      `{prefix}lib rename <ime|#N> <novo ime>` — preimenuj pesmu
      `{prefix}lib info <ime|#N>` — dužina, veličina, ko je dodao, broj puštanja

      `{prefix}play <ime>` pušta otpremljenu pesmu ako ime odgovara,
      sa kratkim upitom da umesto toga pretražiš YouTube.
      Svaki server ima svoju biblioteku. Podržano: mp3, ogg, wav, flac, m4a, opus, aac.

  intros:
    title: "👋 Intra"
    body: |
      **Okidač:** `bot` · `user` · `@pominjanje`

      `{prefix}intro set <okidač>` — postavi podrazumevano intro (priloži audio ili URL)
      `{prefix}intro schedule <okidač> <dani>` — zamena za određene dane (npr. `MON-FRI`, `WEEKDAY`)
      `{prefix}intro unschedule <okidač> <dani>` — ukloni zamenu za određene dane
      `{prefix}intro clear <okidač>` — ukloni sva intra za okidač
      `{prefix}intro rename <okidač> <ime>` — postavi oznaku koja se čita
      `{prefix}intro list` — lista svih okidača za ovaj server
      `{prefix}intro show` — pregled bot/user okidača i podešavanja
      `{prefix}intro trigger <okidač>` — ručno pusti intro
      `{prefix}intro autojoin on|off` — uključi/isključi automatsko pridruživanje

      **Dani:** `MON` `SAT,SUN` `MON-FRI` `WEEKDAY` `WEEKEND`
      Podržani audio formati: `.mp3 .ogg .wav .flac .m4a .opus .aac`

  soundboard:
    title: "🔊 Tabla sa Zvukovima"
    body: |
      `{prefix}sb add <ime> [emoji]` — dodaj zvuk (priloži audio)
      `{prefix}sb remove <ime>` — ukloni zvuk i fajl
      `{prefix}sb play <ime>` — pusti zvuk u svom kanalu
      `{prefix}sb list` — lista svih zvukova
      `{prefix}sb short <ime> <skraćenica>` — postavi kratki okidač za zvuk
      `{prefix}sb panel` — postavi panel sa reakcijama (reaguj da pustiš)

      Alias: `{prefix}soundboard`

  tts:
    title: "🗣️ TTS"
    body: |
      `{prefix}say <tekst>` — izgovori tekst u glasovnom kanalu
      `{prefix}tts voice <ime>` — postavi TTS glas za ovaj server
      `{prefix}tts voices [lokacija]` — lista dostupnih glasova (npr. `en`, `sr`)
      `{prefix}tts rate <+N%|-N%>` — postavi brzinu govora (npr. `+10%`, `-20%`)
      `{prefix}tts stop` — zaustavi TTS
      `{prefix}tts show` — prikaži trenutni glas i brzinu

  settings:
    title: "⚙️ Podešavanja (samo admini)"
    body: |
      `{prefix}settings` (ili `{prefix}settings show`) — prikaži podešavanja servera
      `{prefix}settings set <ključ> <true|false>` — promeni podešavanje
      `{prefix}settings reset <ključ>` — vrati na globalnu podrazumevanu vrednost
      `{prefix}settings locale <kod>` — postavi jezik prikaza (npr. `en`, `sr`)
      `{prefix}settings voice_language <kod>` — postavi jezik TTS glasa

      **Ključevi za uključivanje/isključivanje:**
      `auto_join` — pridruži se kada prva osoba uđe u kanal
      `auto_leave` — napusti kada poslednja osoba izađe
      `notify_write` — šalji tekstualne poruke za odgovore na komande
      `notify_say` — izgovaraj odgovore putem TTS-a kada si u glasovnom kanalu
      `notify_song_text` — prikaži karticu pesme kada se pesma učita
      `notify_song_voice` — izgovori naslov pesme kada se učita
      `notify_say_text` — pošalji poruku nakon `{prefix}say`
      `notify_say_voice` — izgovori potvrdu "Govorim." nakon `{prefix}say`

      **Dev log** (Manage Server):
      `{prefix}devlog here` / `dm` / `off` / `test` — šalji greške ovog servera u ovaj kanal ili u privatne poruke
