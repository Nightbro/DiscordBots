bot:
  name: Night Roller
  prefix: "!"
  version: "1.0"
  color: 0x9B59B6      # embed accent — deep purple
  # Sent when someone DMs the bot "join". Regenerate at
  # Developer Portal -> OAuth2 -> URL Generator if the permissions change.
  invite_url: "https://discord.com/oauth2/authorize?client_id=1542871697491886140&permissions=2815284491020352&integration_type=0&scope=bot+applications.commands"
  emojis:
    dice: "🎲"
    crit: "💥"
    fail: "💀"

dice:
  default_expression: "d20"   # what a bare !roll rolls
  # Any die size works (d3, d7, d37, ...) — these are only abuse guards, not a
  # list of allowed dice. Raise them freely; the embed collapses to per-group
  # subtotals when a roll is too big to print die by die.
  max_dice: 500               # most dice allowed in a single group
  max_sides: 10000            # largest die allowed
  max_groups: 25              # most dice groups in one expression
  show_rolls: true            # list individual die results in the embed
