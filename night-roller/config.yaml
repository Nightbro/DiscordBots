bot:
  name: Night Roller
  prefix: "!"
  version: "1.0"
  color: 0x9B59B6      # embed accent — deep purple
  emojis:
    dice: "🎲"
    crit: "💥"
    fail: "💀"

dice:
  default_expression: "d20"   # what a bare !roll rolls
  max_dice: 100               # most dice allowed in a single group
  max_sides: 1000             # largest die allowed
  max_groups: 10              # most dice groups in one expression
  show_rolls: true            # list individual die results in the embed
